name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quantpilot
          POSTGRES_PASSWORD: quantpilot
          POSTGRES_DB: quantpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations have no drift (alembic check)
        env:
          DATABASE_URL: postgresql://quantpilot:quantpilot@localhost:5432/quantpilot_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Run pytest (unit + API on SQLite, integration on Postgres)
        env:
          TEST_DATABASE_URL: postgresql://quantpilot:quantpilot@localhost:5432/quantpilot_test
          INVESTIGATIONS_SWEEP_ENABLED: "false"
          JWT_SECRET_KEY: ci-test-secret
          OPENAI_API_KEY: ""
          LANGSMITH_TRACING: "false"
          SENTRY_DSN: ""
          OTEL_ENABLED: "false"
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
