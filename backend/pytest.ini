[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
markers =
    integration: needs a real PostgreSQL (set TEST_DATABASE_URL); skipped otherwise
    s3: needs an S3 API such as MinIO (set TEST_S3_ENDPOINT); skipped otherwise
    kafka: needs a Kafka broker (set TEST_KAFKA_BOOTSTRAP); skipped otherwise
    spark: needs pyspark and a Java 17 runtime (the spark-test image); skipped otherwise
