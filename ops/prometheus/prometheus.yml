# Scrapes the QuantPilot API. The API starts without Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quantpilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: quantpilot-api
      - targets: ["host.docker.internal:8000"]
        labels:
          service: quantpilot-api-host
