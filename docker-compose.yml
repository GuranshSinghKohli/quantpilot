# Local production-style stack. Do not put real secrets in this file.
# Copy backend/.env.example → backend/.env and frontend/.env.local.example → frontend/.env.local
#
#   docker compose up --build                                         # production-style
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up # hot reload
#
# Order: postgres (healthy) → migrate (alembic upgrade head, exits 0) → backend.

services:
  postgres:
    # pgvector-enabled Postgres 16. The extension is available but not installed;
    # no migration uses it yet (ADR: pgvector is target, ChromaDB is current).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: quantpilot
      POSTGRES_DB: quantpilot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quantpilot_pg:/var/lib/postgresql/data
      # Runs only when the volume is first created: adds the quantpilot_test database.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
      # The migrate service owns schema changes; the API only checks the revision.
      DB_AUTO_MIGRATE: "false"
      INVESTIGATIONS_SWEEP_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Ingestion pipeline (profile "pipeline"; `make up` does not start these) ---
  # Chainguard publishes the maintained MinIO build; free tags are `latest` only,
  # so the images are pinned by digest.
  minio:
    profiles: ["pipeline"]
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      # Dev-only placeholders, like the Postgres password above. Override in the
      # shell or a root .env; real AWS credentials never go in this file.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quantpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - quantpilot_minio:/data

  # The images have no shell, so readiness and bucket creation are two one-shot
  # mc commands. `mc ready` blocks until the server answers.
  minio-ready:
    profiles: ["pipeline"]
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    environment:
      MC_HOST_lake: http://${MINIO_ROOT_USER:-quantpilot}:${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}@minio:9000
    command: ["ready", "lake"]
    depends_on:
      - minio
    restart: "no"

  minio-init:
    profiles: ["pipeline"]
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    environment:
      MC_HOST_lake: http://${MINIO_ROOT_USER:-quantpilot}:${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}@minio:9000
    # Versioning is a second guard behind conditional writes. `lake init` also
    # enables it on a bucket that already existed.
    command: ["mb", "--ignore-existing", "--with-versioning", "lake/${LAKE_BUCKET:-quantpilot-lake}"]
    depends_on:
      minio-ready:
        condition: service_completed_successfully
    restart: "no"

  # Single-node Kafka in KRaft mode (broker + controller, no ZooKeeper).
  # RF 1 on one disk: a development transport, not production durability.
  kafka:
    profiles: ["pipeline"]
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: cXVhbnRwaWxvdC1rYWZrYQ  # fixed so restarts reuse the same log dirs
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics exist only if `kafka init` created them.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - quantpilot_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # Creates missing topics and verifies existing ones from Settings (one source of truth).
  kafka-init:
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements-pipeline.txt
    image: quantpilot-pipeline:dev
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "app.pipeline", "kafka", "init"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # Consumes the raw topics into the MinIO lake and updates ingestion_records.
  lake-writer:
    profiles: ["pipeline"]
    image: quantpilot-pipeline:dev
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
      DB_AUTO_MIGRATE: "false"
      ENVIRONMENT: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LAKE_BACKEND: s3
      LAKE_BUCKET: ${LAKE_BUCKET:-quantpilot-lake}
      LAKE_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-quantpilot}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}
    command: ["python", "-m", "app.pipeline", "lake-writer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    # Unexpected errors exit without committing offsets; restart → redelivery.
    restart: on-failure

  # One-shot source ingestion (`make ingest-news|ingest-market|ingest-company`,
  # `make sources-check`). Own profile, so `pipeline-up` never starts it and the
  # lake writer never sees provider keys. Keys come from the shell or the
  # git-ignored repo-root .env; empty means "not configured".
  ingest:
    profiles: ["ingest"]
    image: quantpilot-pipeline:dev
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
      DB_AUTO_MIGRATE: "false"
      ENVIRONMENT: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      MARKET_API_KEY: ${MARKET_API_KEY:-}
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
      NEWS_BASE_URL: ${NEWS_BASE_URL:-https://api.massive.com}
      MARKET_BASE_URL: ${MARKET_BASE_URL:-https://api.massive.com}
      COMPANY_BASE_URL: ${COMPANY_BASE_URL:-https://www.sec.gov}
      NEWS_TICKERS: ${NEWS_TICKERS:-AAPL,MSFT,NVDA}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-AAPL,MSFT,NVDA}
      COMPANY_SYMBOLS: ${COMPANY_SYMBOLS:-AAPL,MSFT,NVDA}
    command: ["python", "-m", "app.pipeline", "sources", "check"]
    restart: "no"

  # One-shot canonical loading (`make load-news|load-market|load-company|load-all`):
  # the processed Parquet a COMPLETED processing job's manifest names → Postgres.
  # pyarrow only (no Spark, no Kafka, no provider keys).
  load:
    profiles: ["load"]
    image: quantpilot-pipeline:dev
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
      DB_AUTO_MIGRATE: "false"
      ENVIRONMENT: development
      LAKE_BACKEND: s3
      LAKE_BUCKET: ${LAKE_BUCKET:-quantpilot-lake}
      LAKE_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-quantpilot}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}
    command: ["python", "-m", "app.pipeline", "load", "--help"]
    restart: "no"

  # One-shot Spark processing (`make spark-news|spark-market|spark-company|spark-all`):
  # raw lake objects in MinIO → processed Parquet + rejects + manifest, tracked in
  # processing_jobs. PySpark local[*] inside this container; S3A reads the AWS_*
  # variables (never the Spark conf). No provider keys, no Kafka.
  spark:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: Dockerfile
      target: spark
      args:
        REQUIREMENTS: requirements-pipeline.txt
    image: quantpilot-spark:dev
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
      DB_AUTO_MIGRATE: "false"
      ENVIRONMENT: development
      LAKE_BACKEND: s3
      LAKE_BUCKET: ${LAKE_BUCKET:-quantpilot-lake}
      LAKE_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-quantpilot}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      CODE_VERSION: ${CODE_VERSION:-}
    command: ["python", "-m", "app.pipeline", "process", "--help"]
    restart: "no"

  # Spark test tier (`make test-spark`): the repo is mounted (backend + the root
  # evals/ and mcp_server/ packages the full suite imports), so no rebuild per edit.
  # MinIO tests use throwaway quantpilot-test-* buckets; the Postgres tier uses
  # TEST_DATABASE_URL when given (never the compose dev database).
  spark-test:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: Dockerfile
      target: spark-test
      args:
        REQUIREMENTS: requirements-pipeline.txt
    image: quantpilot-spark-test:dev
    environment:
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_S3_ENDPOINT: http://minio:9000
      TEST_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-quantpilot}
      TEST_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-quantpilot-dev-only}
      TEST_DATABASE_URL: ${SPARK_TEST_DATABASE_URL:-}
      TEST_KAFKA_BOOTSTRAP: ${SPARK_TEST_KAFKA_BOOTSTRAP:-}
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["pytest", "tests/spark", "-q", "-p", "no:cacheprovider"]
    restart: "no"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

volumes:
  quantpilot_pg:
  quantpilot_minio:
  quantpilot_kafka:
