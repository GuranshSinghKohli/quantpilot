# Local production-style stack. Do not put real secrets in this file.
# Copy backend/.env.example → backend/.env and frontend/.env.local.example → frontend/.env.local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: quantpilot
      POSTGRES_DB: quantpilot
    ports:
      - "5432:5432"
    volumes:
      - quantpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://quantpilot:quantpilot@postgres:5432/quantpilot
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
      BRIEFING_ENABLED: "false"
      ALERTS_ENABLED: "false"
      INVESTIGATIONS_SWEEP_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  quantpilot_pg:
